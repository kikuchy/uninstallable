name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.11'
          install: false
          cache: false
      - run: jq --version && mise --version && bash -n uninstallable.sh
      - run: python3 -m unittest discover -s tests -v
